function renderContacts(){const c=t();const items=ordered('contacts',CONTACTS);$('#contacts').innerHTML=items.map(x=>`<a data-item="${x.id}" class="contact-tile" data-icon="${x.icon}" href="${x.url}" target="_blank" rel="noreferrer"><span class="ico-circle">${icon(x.icon)}</span><span>${x.id==='phone'?c.call:x.label}</span></a>`).join('');$$('#contacts [data-icon="phone"]').forEach(a=>a.onclick=e=>{e.preventDefault();openPhoneAction()});const box=$('#workEmail');if(profile==='work'){box.hidden=false;$('#workEmailIcon').innerHTML=icon('mail');$('#workEmailLabel').textContent=lang==='en'?'Work email':'Рабочая почта';$('#workEmailAddress').textContent=WORK_EMAIL;$('#workEmailLink').href=`mailto:${WORK_EMAIL}`;$('#workEmailLink').onclick=e=>{e.preventDefault();openEmailAction()};$('#workEmailNote').textContent=lang==='en'?'Opens email actions.':'Открывает действия с рабочей почтой.'}else{box.hidden=true}}
function renderActions(){const c=t();const ids=state.items[profile].actions||['share','save'];const host=$('#systemActions');ids.forEach(id=>host.appendChild($('#'+id)));$('#share').querySelector('.ico-circle').innerHTML=icon('share');$('#save').querySelector('.ico-circle').innerHTML=icon('save');$('#shareLabel').textContent=c.share;$('#saveLabel').textContent=c.save}
function applyBlockOrder(){const stack=$('#contentStack');state.blockOrder.forEach(id=>{const el=stack.querySelector(`[data-block="${id}"]`);if(el)stack.appendChild(el)})}
function stripLegacyGlyph(label){return String(label||'').replace(/^(?:↗|▣|⧉|👤|🛒)\s*/u,'')}
function actionMarkup(iconName,label){return `<span class="menu-action-icon">${icon(iconName)}</span><span class="menu-action-label">${stripLegacyGlyph(label)}</span>`}
function updateModalCopy(){const c=t();
$('#shareTitle').textContent=c.shareMenuTitle;$('#shareDescription').textContent=c.shareMenuDescription;$('#shareLink').innerHTML=actionMarkup('send',c.shareLink);$('#shareQr').innerHTML=actionMarkup('qr',c.qrCard);$('#copyLink').innerHTML=actionMarkup('copy',c.copyLink);$('#shareBack').textContent=c.back;
$('#contactTitle').textContent=c.contactMenuTitle;$('#contactDescription').textContent=c.contactMenuDescription;$('#contactSave').innerHTML=actionMarkup('contactAdd',c.saveContact);$('#contactQr').innerHTML=actionMarkup('qr',c.contactQr);$('#contactShare').innerHTML=actionMarkup('send',c.shareContact);$('#contactBack').textContent=c.back;
$('#contactQrTitle').textContent=c.contactQrTitle;$('#contactQrDescription').textContent=c.contactQrDescription;$('#contactQrClose').textContent=c.close;
$('#qrChoiceTitle').textContent=c.qrChoiceTitle;$('#qrChoiceDescription').textContent=c.qrChoiceDescription;$('#qrChoiceCard').innerHTML=actionMarkup('qr',c.qrChoiceCard);$('#qrChoiceContact').innerHTML=actionMarkup('contactAdd',c.qrChoiceContact);$('#qrChoiceBack').textContent=c.back;
$('#qrTitle').textContent=c.qrTitle;$('#qrDescription').textContent=c.qrDescription;$('#qrUrl').textContent=cardPublicUrl();$('#qrClose').textContent=c.close;
$('#ctaTitle').textContent=c.ctaTitle;$('#ctaConstructor').innerHTML=actionMarkup('card',c.ctaOrder);$('#ctaContact').innerHTML=actionMarkup('contactAdd',c.ctaContact);$('#ctaInfoNote').textContent=lang==='en'?'Constructor is coming soon. For now, message me in a convenient messenger.':lang==='uk'?'Конструктор скоро буде. Поки що можна написати мені у зручному месенджері.':'Конструктор скоро будет. Пока можно написать мне в удобном мессенджере.';$('#ctaContactTitle').textContent=c.personalContactTitle;$('#ctaContactDescription').textContent=lang==='en'?'Choose a convenient messenger.':lang==='uk'?'Оберіть зручний месенджер.':'Выберите удобный мессенджер.';$('#ctaContactBack').textContent=c.back;$('#ctaBack').textContent=c.back;$('#serviceBack').textContent=c.back;
$('#viberTitle').textContent=c.viberTitle;$('#viberDescription').textContent=`${c.viberDescription} ${PHONE}`;$('#viberOpen').innerHTML=actionMarkup('viber',c.viberOpen);$('#viberClose').textContent=c.close;$('#quickQr').setAttribute('aria-label',c.qrChoiceTitle);$('#quickQr').title=c.qrChoiceTitle}
function currentHeaderMode(){return profile==='work'?'hero-a':'center'}
function placeProfileSwitch(){const sw=$('#profileSwitch'),copy=$('.hero-copy');copy.insertBefore(sw,$('#name'))}
function render(){if(!DATA[profile].langs.includes(lang))lang='ru';document.body.dataset.profile=profile;document.body.dataset.header=currentHeaderMode();$('#heroArea').style.setProperty('--hero-bg',`url("${PHOTO}")`);placeProfileSwitch();document.documentElement.lang=lang;const c=t();$('#photo').src=PHOTO;$('#photo').alt=c.name;$('#name').textContent=c.name;$('#title').textContent=c.title;$('#description').textContent=c.description;$('#pagesHeading').textContent=c.pages;$('#productsHeading').textContent=c.products;$('#contactsHeading').textContent=c.contacts;$('#systemHeading').textContent=c.system;$$('#profileSwitch [data-profile]').forEach(b=>b.classList.toggle('active',b.dataset.profile===profile));renderLang();renderPages();renderProducts();renderContacts();renderActions();makeVcf();applyBlockOrder();updateModalCopy()}
function setProfile(next){profile=next==='work'?'work':'cartographer';let saved='ru';try{saved=localStorage.getItem(`card-language-${profile}`)||'ru'}catch(e){}lang=DATA[profile].langs.includes(saved)?saved:'ru';updateQuery();render()}
$$('#profileSwitch [data-profile]').forEach(b=>b.onclick=()=>setProfile(b.dataset.profile));
function openShare(){updateModalCopy();openModal('#shareModal')}
function openContact(){updateModalCopy();openModal('#contactModal')}
async function openCardQr(){closeModal('#shareModal');closeModal('#qrChoiceModal');updateModalCopy();openModal('#qrModal');const ok=await generateQr($('#qrCanvas'),cardPublicUrl(),'M');if(!ok)showToast('QR unavailable')}
async function openContactQr(){closeModal('#contactModal');closeModal('#qrChoiceModal');updateModalCopy();openModal('#contactQrModal');const err=$('#contactQrError');err.classList.remove('show');err.textContent='';const ok=await generateQr($('#contactQrCanvas'),makeVcf(),'L');if(!ok){err.textContent=lang==='en'?'Could not create the contact QR code.':'Не удалось создать QR-код контакта.';err.classList.add('show')}}
function renderCtaContactOptions(){const items=CONTACTS.filter(x=>x.icon!=='phone');$('#ctaContactOptions').innerHTML=items.map(x=>`<a class="menu-link" data-icon="${x.icon}" href="${x.url}" target="_blank" rel="noreferrer"><span class="menu-action-icon">${icon(x.icon)}</span><span class="menu-action-label">${x.label}</span></a>`).join('')}
function openPhoneAction(){const c=t();$('#phoneActionTitle').textContent=c.call||'Позвонить';$('#phoneActionDescription').textContent=lang==='en'?'Choose an action for the phone number.':lang==='uk'?'Оберіть дію для номера телефону.':'Выберите действие для номера телефона.';$('#phoneActionValue').textContent=PHONE;$('#phoneActionOpen').innerHTML=actionMarkup('phone',lang==='en'?'Call':lang==='uk'?'Зателефонувати':'Позвонить');$('#phoneActionOpen').href=`tel:${PHONE}`;$('#phoneActionCopy').innerHTML=actionMarkup('copy',lang==='en'?'Copy number':lang==='uk'?'Скопіювати номер':'Скопировать номер');$('#phoneActionNote').textContent=lang==='en'?'In embedded previews the Call button may be blocked; copying the number always remains available.':lang==='uk'?'У вбудованому preview кнопка дзвінка може блокуватися; копіювання номера залишається доступним.':'Во встроенном preview кнопка звонка может блокироваться; копирование номера остаётся доступным.';$('#phoneActionBack').textContent=c.back;openModal('#phoneActionModal')}
function openEmailAction(){const c=t();$('#emailActionTitle').textContent=lang==='en'?'Work email':lang==='uk'?'Робоча пошта':'Рабочая почта';$('#emailActionDescription').textContent=lang==='en'?'Choose an action for the email address.':lang==='uk'?'Оберіть дію для електронної пошти.':'Выберите действие для рабочего email.';$('#emailActionValue').textContent=WORK_EMAIL;$('#emailActionOpen').innerHTML=actionMarkup('mail',lang==='en'?'Write an email':lang==='uk'?'Написати лист':'Написать письмо');$('#emailActionOpen').href=`mailto:${WORK_EMAIL}`;$('#emailActionCopy').innerHTML=actionMarkup('copy',lang==='en'?'Copy email':lang==='uk'?'Скопіювати email':'Скопировать email');$('#emailActionNote').textContent=lang==='en'?'In embedded previews the mail app may not open; copying the address remains available.':lang==='uk'?'У вбудованому preview поштовий застосунок може не відкритися; копіювання адреси залишається доступним.':'Во встроенном preview почтовое приложение может не открыться; копирование адреса остаётся доступным.';$('#emailActionBack').textContent=c.back;openModal('#emailActionModal')}
function openCta(){updateModalCopy();openModal('#ctaModal')}
function openCtaContacts(){closeModal('#ctaModal');updateModalCopy();renderCtaContactOptions();openModal('#ctaContactModal')}
function openService(id){const item=DATA.work.products.find(x=>x.id===id&&x.kind==='service');if(!item)return;const label=item.labels[lang]||item.labels.ru;const detail=item.details?.[lang]||item.details?.ru||'';$('#serviceTitle').textContent=label;$('#serviceDescription').textContent=detail;$('#serviceContact').innerHTML=actionMarkup('telegram',lang==='en'?'Message me about this':'Написать мне по этому направлению');$('#serviceNote').textContent=lang==='en'?'Direct Telegram contact; no duplicated messenger list here.':'Прямой контакт в Telegram; без дублирования списка мессенджеров.';$('#serviceBack').textContent=t().back;openModal('#serviceModal')}
$('#share').onclick=openShare;$('#save').onclick=openContact;$('#quickQr').onclick=()=>{updateModalCopy();openModal('#qrChoiceModal')};
$('#shareBack').onclick=()=>closeModal('#shareModal');$('#contactBack').onclick=()=>closeModal('#contactModal');$('#contactQrClose').onclick=()=>closeModal('#contactQrModal');$('#qrChoiceBack').onclick=()=>closeModal('#qrChoiceModal');$('#qrClose').onclick=()=>closeModal('#qrModal');$('#ctaBack').onclick=()=>closeModal('#ctaModal');$('#ctaContactBack').onclick=()=>{closeModal('#ctaContactModal');openModal('#ctaModal')};$('#serviceBack').onclick=()=>closeModal('#serviceModal');$('#viberClose').onclick=()=>closeModal('#viberModal');$('#phoneActionBack').onclick=()=>closeModal('#phoneActionModal');$('#emailActionBack').onclick=()=>closeModal('#emailActionModal');$('#phoneActionCopy').onclick=async()=>{const ok=await copyText(PHONE);showToast(ok?(lang==='en'?'Phone number copied':lang==='uk'?'Номер скопійовано':'Номер скопирован'):PHONE)};$('#emailActionCopy').onclick=async()=>{const ok=await copyText(WORK_EMAIL);showToast(ok?(lang==='en'?'Email copied':lang==='uk'?'Email скопійовано':'Email скопирован'):WORK_EMAIL)};
$('#shareQr').onclick=openCardQr;$('#contactQr').onclick=openContactQr;$('#qrChoiceCard').onclick=openCardQr;$('#qrChoiceContact').onclick=openContactQr;$('#contactSave').onclick=download;$('#contactShare').onclick=shareContact;$('#ctaContact').onclick=openCtaContacts;
$('#shareLink').onclick=async()=>{const c=t(),url=cardPublicUrl(),data={title:c.name,text:`${c.name} — ${c.title}`,url};try{if(navigator.share)await navigator.share(data);else{await copyText(url);showToast(c.copied)}}catch(e){if(e.name!=='AbortError'){try{await copyText(url);showToast(c.copied)}catch(_){showToast(url)}}}closeModal('#shareModal')};
$('#copyLink').onclick=async()=>{const c=t(),url=cardPublicUrl();try{await copyText(url);showToast(c.copied)}catch(e){showToast(url)}closeModal('#shareModal')};
document.addEventListener('click',async e=>{const v=e.target.closest('[data-icon="viber"]');if(!v)return;e.preventDefault();await copyText(PHONE);updateModalCopy();openModal('#viberModal')});
['#shareModal','#contactModal','#contactQrModal','#qrChoiceModal','#qrModal','#ctaModal','#ctaContactModal','#serviceModal','#viberModal','#phoneActionModal','#emailActionModal'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))closeModal(id)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')['#shareModal','#contactModal','#contactQrModal','#qrChoiceModal','#qrModal','#ctaModal','#ctaContactModal','#serviceModal','#viberModal','#phoneActionModal','#emailActionModal'].forEach(closeModal)});
profile=queryProfile();let saved='ru';try{saved=localStorage.getItem(`card-language-${profile}`)||'ru'}catch(e){}lang=DATA[profile].langs.includes(saved)?saved:'ru';render();
</script>
