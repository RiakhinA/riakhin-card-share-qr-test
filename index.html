<style>
:root{--ink:#21493f;--accent:#315f4e;--muted:#62736d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 22%,#edf3d8 0,transparent 24%),radial-gradient(circle at 86% 70%,#f5ead2 0,transparent 27%),#f4f1e9;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{min-height:100svh;display:grid;place-items:center;padding:28px 15px}.card{position:relative;width:min(100%,460px);text-align:center;background:rgba(255,253,248,.93);border:1px solid #fff;border-radius:31px;padding:30px 24px 27px;box-shadow:0 20px 52px rgba(45,58,39,.15)}.portrait{width:132px;height:132px;object-fit:cover;object-position:center 25%;border-radius:50%;border:5px solid #f5ebdd;box-shadow:0 8px 22px rgba(55,68,46,.18);margin-bottom:12px}.language-switch{position:absolute;top:20px;right:20px;display:inline-flex;gap:3px;margin:0;padding:3px;border:1px solid #e4d6c3;border-radius:999px;background:#f8f3e9}.language-switch button{border:0;border-radius:999px;padding:6px 10px;background:transparent;color:#60726b;font:700 11px Arial,Helvetica,sans-serif;letter-spacing:.05em;cursor:pointer}.language-switch button.active{background:var(--accent);color:#fffdf5;box-shadow:0 2px 6px rgba(31,68,52,.18)}.quick-qr{position:absolute;top:58px;right:22px;width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid #e4d6c3;border-radius:14px;background:#fffefa;color:var(--accent);box-shadow:0 4px 10px rgba(79,73,48,.08);cursor:pointer}.quick-qr svg{width:21px;height:21px;display:block}.quick-qr:focus-visible{outline:3px solid #b8cbbd;outline-offset:3px}h1{font:35px/1.07 Georgia,serif;letter-spacing:-.04em;margin:0}.title{margin:12px auto 0;max-width:320px;color:#416b5f;font-size:15px;font-weight:700;line-height:1.43}.description{border-top:1px solid #e5d8c4;margin:22px 2px 0;padding:20px 2px 0;color:#405750;font-size:15px;line-height:1.56}.heading{display:flex;align-items:center;gap:11px;margin:25px 0 12px;color:#395949;font:700 14px Georgia,serif;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}.heading:before,.heading:after{content:"";height:1px;background:#e3caa7;flex:1}.socials{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.socials a{grid-column:span 2;min-height:67px;display:grid;place-items:center;align-content:center;gap:4px;border:1px solid #e5dacb;border-radius:16px;color:var(--ink);background:#fffefa;text-decoration:none;font-size:11px;font-weight:700}.socials a:nth-child(4){grid-column:2 / span 2}.socials .ico svg{width:23px;height:23px;display:block}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.contacts a,.action{min-height:55px;padding:9px 12px;display:flex;align-items:center;justify-content:flex-start;gap:9px;border:1px solid #e5d5c2;border-radius:16px;background:#fffefa;color:var(--ink);box-shadow:0 4px 10px rgba(79,73,48,.05);text-decoration:none;font-size:14px;font-weight:700}.ico{width:25px;height:25px;display:grid;place-items:center;color:#fffefa;background:var(--accent);border-radius:50%;font-weight:700}.socials .ico{background:none;color:var(--ink);font-size:20px}.products{display:grid;gap:10px}.product-link{min-height:59px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 15px;border-radius:16px;text-decoration:none;font:700 15px Georgia,serif;box-shadow:0 8px 18px rgba(31,68,52,.14)}.product-link.primary{background:linear-gradient(105deg,#294e3c,#1c4535);color:#fffdf5;box-shadow:0 8px 18px rgba(31,68,52,.22)}.product-link.secondary{border:1px solid var(--accent);background:#fffefa;color:var(--ink);flex-direction:column;gap:3px}.product-link.secondary small{font:700 10px Arial,Helvetica,sans-serif;letter-spacing:.04em;color:var(--muted)}.actions{display:grid;gap:10px;margin-top:19px}.action{width:100%;cursor:pointer;font:700 14px Arial,Helvetica,sans-serif}.hint,.notice{margin:14px 7px 0;color:var(--muted);font-size:12px;line-height:1.45}.notice{color:#315f4e;font-weight:700}.modal{position:fixed;inset:0;background:rgba(18,40,32,.38);display:none;place-items:end center;padding:18px;z-index:5}.modal.open{display:grid}.sheet{width:min(100%,460px);background:#fffdf7;border-radius:24px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.sheet h2{font:24px Georgia,serif;margin:0 0 7px}.sheet p{color:var(--muted);font-size:13px;line-height:1.4;margin:0 0 15px}.sheet button{width:100%;min-height:52px;margin-top:9px;border:1px solid #b8cbbd;border-radius:14px;background:#fffefa;color:var(--ink);font-weight:700;font-size:14px}.sheet .viber-open,.sheet .cta-link{width:100%;min-height:52px;margin-top:9px;display:flex;align-items:center;justify-content:center;border:1px solid #b8cbbd;border-radius:14px;background:#fffefa;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}.sheet .viber-open{background:var(--accent);color:#fffefa}.sheet .close{border:0;background:none;color:var(--muted)}.qr-modal{place-items:center;overflow-y:auto;overscroll-behavior:contain;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.qr-sheet{width:min(100%,390px);max-height:calc(100dvh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:center}.qr-canvas{width:min(300px,calc(100vw - 72px),calc(100dvh - 220px));height:min(300px,calc(100vw - 72px),calc(100dvh - 220px));margin:18px auto;background:#fff;padding:12px;border:1px solid #e5d5c2;border-radius:18px;display:grid;place-items:center;overflow:hidden}.qr-canvas canvas,.qr-canvas img{max-width:100%!important;max-height:100%!important;width:100%!important;height:100%!important;display:block}.qr-url{overflow-wrap:anywhere;font-size:11px!important;margin-top:14px!important}@media(max-width:380px){.card{padding:26px 16px 24px}.portrait{width:114px;height:114px}h1{font-size:31px}.contacts a{font-size:13px;padding-inline:9px}.heading{font-size:13px}}
</style>
</head>
<body>
<main class="shell"><section class="card"><img id="photo" class="portrait" alt=""><div class="language-switch" aria-label="Мова візитки"><button type="button" data-lang="ru" class="active">RU</button><button type="button" data-lang="uk">UA</button></div><button id="quick-qr" class="quick-qr" type="button" aria-label="Показать QR-код" title="Показать QR-код"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm7-2h2v2h-2v-2Zm3 0h3v2h-1v2h-2v-4Zm4 0h2v4h-2v-4Zm-7 3h2v2h-2v-2Zm3 1h2v3h-2v-3Zm3 1h3v2h-3v-2Z"/></svg></button><h1 id="name"></h1><p id="title" class="title"></p><p id="description" class="description"></p><p id="socials-heading" class="heading"></p><div id="socials" class="socials"></div><p id="products-heading" class="heading"></p><div class="products"><a id="website" class="product-link primary" target="_blank" rel="noreferrer"></a><a id="card-cta" class="product-link secondary" target="_blank" rel="noreferrer"></a></div><p id="contacts-heading" class="heading"></p><div id="contacts" class="contacts"></div><div class="actions"><button class="action" id="share"></button><button class="action" id="save"></button></div><p id="hint" class="hint"></p><p id="notice" class="notice"></p></section></main>
<div id="share-modal" class="modal" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="share-menu-title"><h2 id="share-menu-title"></h2><p id="share-menu-description"></p><button id="share-link"></button><button id="qr-code"></button><button id="share-back" class="close"></button></div></div>
<div id="contact-modal" class="modal" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="contact-menu-title"><h2 id="contact-menu-title"></h2><p id="contact-menu-description"></p><button id="contact-save"></button><button id="contact-share"></button><button id="contact-back" class="close"></button></div></div>
<div id="qr-modal" class="modal qr-modal" aria-hidden="true"><div class="sheet qr-sheet" role="dialog" aria-modal="true" aria-labelledby="qr-title"><h2 id="qr-title"></h2><p id="qr-description"></p><div id="qr-canvas" class="qr-canvas" aria-label="QR-код визитки"></div><p id="qr-url" class="qr-url"></p><button id="qr-close" class="close"></button></div></div>
<div id="cta-modal" class="modal" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cta-title"><h2 id="cta-title"></h2><a id="cta-order" class="cta-link" target="_blank" rel="noreferrer"></a><a id="cta-contact" class="cta-link" target="_blank" rel="noreferrer"></a></div></div>
<div id="viber-modal" class="modal"><div class="sheet"><h2 id="viber-title"></h2><p id="viber-description"></p><a id="viber-open" class="viber-open" href="viber://"></a><button id="viber-close" class="close"></button></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const PUBLIC_CARD_URL='https://riakhin-card.my-webcard.workers.dev/';
const CTA_DESTINATIONS=Object.freeze({ORDER:'https://t.me/riakhin_card_bot',CONTACT:'https://t.me/riakhin_anton'});
const icons={instagram:'◎',facebook:'f',linkedin:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V8.99h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.29ZM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.1 20.45H3.54V8.99H7.1v11.46Z"/></svg>',youtube:'▶',tiktok:'♪',compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m14.8 9.2-2 5.6-5.6 2 2-5.6 5.6-2Z"/><path d="m12 3v2M12 19v2M3 12h2M19 12h2"/></svg>',telegram:'➤',whatsapp:'◔',viber:'◌',phone:'☎'};
const copy={ru:{name:'Антон Ряхин',title:'Картограф ваших привычек и сценариев. Выход из кризиса.',description:'Помогаю понять, почему прежний путь больше не работает, выбраться из кризиса и найти опору для следующего шага.',socials:'Мои страницы',products:'Мои продукты',contacts:'Связаться со мной',website:'Карта выхода из тупика + бонус',cardCta:'Хочу такую визитку',share:'↗  Поделиться визиткой',save:'▣  Сохранить контакт в телефонную книгу',hint:'Контакт можно добавить в телефонную книгу или переслать в мессенджере.',shareMenuTitle:'Поделиться визиткой',shareMenuDescription:'Выбери способ передать визитку.',shareLink:'↗  Отправить ссылку',qr:'▣  Показать QR-код',contactMenuTitle:'Сохранить контакт',contactMenuDescription:'Выбери действие.',saveContact:'👤  Добавить в телефонную книгу',shareContact:'↗  Отправить контакт',back:'Назад',qrTitle:'QR-код визитки',qrDescription:'Наведите камеру другого телефона, чтобы открыть визитку.',qrClose:'Закрыть',quickQr:'Показать QR-код',ctaTitle:'Хочу такую визитку',ctaOrder:'🛒  Заказать визитку через Telegram-бот',ctaContact:'👤  Связаться со мной',copied:'Ссылка скопирована.',ready:'Визитка готова к отправке.',contact:'Контакт ',phone:'Позвонить',viber:'Номер скопирован. Открой Viber и вставь его в поиск.',viberTitle:'Номер скопирован',viberDescription:'В Viber вставь этот номер в поиск:',viberOpen:'Перейти в Viber',viberClose:'Закрыть',loadError:'Не удалось загрузить настройки визитки.'},uk:{name:'Антон Ряхін',title:'Картограф ваших звичок і сценаріїв. Вихід із кризи.',description:'Допомагаю зрозуміти, чому попередній шлях більше не працює, вийти з кризи й знайти опору для наступного кроку.',socials:'Мої сторінки',products:'Мої продукти',contacts:'Зв’язатися зі мною',website:'Карта виходу з глухого кута + бонус',cardCta:'Хочу таку візитку',share:'↗  Поділитися візиткою',save:'▣  Зберегти контакт у телефонну книгу',hint:'Контакт можна додати до телефонної книги або переслати в месенджері.',shareMenuTitle:'Поділитися візиткою',shareMenuDescription:'Обери спосіб передати візитку.',shareLink:'↗  Надіслати посилання',qr:'▣  Показати QR-код',contactMenuTitle:'Зберегти контакт',contactMenuDescription:'Обери дію.',saveContact:'👤  Додати до телефонної книги',shareContact:'↗  Надіслати контакт',back:'Назад',qrTitle:'QR-код візитки',qrDescription:'Наведіть камеру іншого телефона, щоб відкрити візитку.',qrClose:'Закрити',quickQr:'Показати QR-код',ctaTitle:'Хочу таку візитку',ctaOrder:'🛒  Замовити візитку через Telegram-бот',ctaContact:"👤  Зв'язатися зі мною",copied:'Посилання скопійовано.',ready:'Візитка готова до надсилання.',contact:'Контакт ',phone:'Зателефонувати',viber:'Номер скопійовано. Відкрий Viber і встав його в пошук.',viberTitle:'Номер скопійовано',viberDescription:'У Viber встав цей номер у пошук:',viberOpen:'Перейти до Viber',viberClose:'Закрити',loadError:'Не вдалося завантажити налаштування візитки.'}};
let c,vcf,lang='ru';
const $=s=>document.querySelector(s),notice=t=>$('#notice').textContent=t;
const shareUrl=PUBLIC_CARD_URL;
function makeVcf(){const t=copy[lang];vcf=`BEGIN:VCARD\nVERSION:3.0\nFN:${t.name}\nTITLE:${t.title}\nTEL;TYPE=CELL,VOICE:${c.phone}\nURL:${c.website.url}\n${[...c.socials,...c.contacts].map(x=>'URL;TYPE='+x.label+':'+x.url).join('\n')}\nEND:VCARD`;}
function setLanguage(next){lang=next;const t=copy[lang];document.documentElement.lang=lang;document.title=t.name+' — '+(lang==='uk'?'цифрова візитка':'цифровая визитка');$('#photo').alt=t.name;$('#name').textContent=t.name;$('#title').textContent=t.title;$('#description').textContent=t.description;$('#socials-heading').textContent=t.socials;$('#products-heading').textContent=t.products;$('#contacts-heading').textContent=t.contacts;$('#website').textContent='⌁  '+t.website;$('#card-cta').innerHTML='<span>◉  '+t.cardCta+'</span><small>Riakhin Card</small>';$('#share').textContent=t.share;$('#save').textContent=t.save;$('#hint').textContent=t.hint;$('#share-menu-title').textContent=t.shareMenuTitle;$('#share-menu-description').textContent=t.shareMenuDescription;$('#share-link').textContent=t.shareLink;$('#qr-code').textContent=t.qr;$('#share-back').textContent=t.back;$('#contact-menu-title').textContent=t.contactMenuTitle;$('#contact-menu-description').textContent=t.contactMenuDescription;$('#contact-save').textContent=t.saveContact;$('#contact-share').textContent=t.shareContact;$('#contact-back').textContent=t.back;$('#qr-title').textContent=t.qrTitle;$('#qr-description').textContent=t.qrDescription;$('#qr-url').textContent=PUBLIC_CARD_URL;$('#qr-close').textContent=t.qrClose;$('#quick-qr').setAttribute('aria-label',t.quickQr);$('#quick-qr').title=t.quickQr;$('#cta-title').textContent=t.ctaTitle;$('#cta-order').textContent=t.ctaOrder;$('#cta-contact').textContent=t.ctaContact;$('#cta-order').href=CTA_DESTINATIONS.ORDER;$('#cta-contact').href=CTA_DESTINATIONS.CONTACT;$('#viber-title').textContent=t.viberTitle;$('#viber-description').textContent=t.viberDescription+' '+c.phone;$('#viber-open').textContent=t.viberOpen;$('#viber-close').textContent=t.viberClose;render('#socials',c.socials);render('#contacts',c.contacts.map(x=>x.icon==='phone'?{...x,label:t.phone}:x));makeVcf();document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));try{localStorage.setItem('card-language',lang)}catch(e){}}
fetch('./site-config.json').then(r=>r.json()).then(data=>{c=data;$('#photo').src=data.photo;$('#website').href=data.website.url;$('#card-cta').href=data.cardCta.url;let saved='ru';try{saved=localStorage.getItem('card-language')||'ru'}catch(e){}setLanguage(saved==='uk'?'uk':'ru')}).catch(()=>notice(copy[lang].loadError));
function render(sel,items){$(sel).innerHTML=items.map(x=>`<a href="${x.url}" data-icon="${x.icon}" target="_blank" rel="noreferrer"><span class="ico">${icons[x.icon]||'↗'}</span>${x.label}</a>`).join('')}
function file(){return new File([vcf],'contact.vcf',{type:'text/vcard;charset=utf-8'})}function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([vcf],{type:'text/vcard;charset=utf-8'}));a.download='contact.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),300)}
async function shareContact(){try{const f=file(),t=copy[lang];if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:t.name,text:t.contact+t.name,files:[f]});else download()}catch(e){if(e.name!=='AbortError')download()}}
function closeModal(id){$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true');}
function openModal(id){$(id).classList.add('open');$(id).setAttribute('aria-hidden','false');}
function openQr(){closeModal('#share-modal');openModal('#qr-modal');const target=$('#qr-canvas');target.innerHTML='';if(window.QRCode){const qrSize=Math.floor(Math.min(target.clientWidth,target.clientHeight)-24);new QRCode(target,{text:PUBLIC_CARD_URL,width:qrSize,height:qrSize,colorDark:'#21493f',colorLight:'#fffefa',correctLevel:QRCode.CorrectLevel.M});}else{closeModal('#qr-modal');notice(lang==='uk'?'Не вдалося завантажити QR-код.':'Не удалось загрузить QR-код.');}}
function saveContact(){download();}
$('#save').onclick=()=>openModal('#contact-modal');$('#share').onclick=()=>openModal('#share-modal');$('#quick-qr').onclick=openQr;$('#card-cta').onclick=e=>{e.preventDefault();openModal('#cta-modal');};$('#share-back').onclick=()=>closeModal('#share-modal');$('#contact-back').onclick=()=>closeModal('#contact-modal');$('#qr-code').onclick=openQr;$('#qr-close').onclick=()=>closeModal('#qr-modal');$('#contact-save').onclick=saveContact;$('#contact-share').onclick=shareContact;$('#viber-close').onclick=()=>$('#viber-modal').classList.remove('open');
document.addEventListener('click',e=>{['#share-modal','#contact-modal','#qr-modal','#cta-modal'].forEach(id=>{if(e.target===$(id))closeModal(id)});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){['#share-modal','#contact-modal','#qr-modal','#cta-modal'].forEach(closeModal);}});
document.addEventListener('click',async e=>{const v=e.target.closest('[data-icon="viber"]');if(!v)return;e.preventDefault();await navigator.clipboard.writeText(c.phone).catch(()=>{});$('#viber-modal').classList.add('open')});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>c&&setLanguage(b.dataset.lang));
$('#share-link').onclick=async()=>{const t=copy[lang],data={title:t.name,text:t.name+' - '+t.title+'\n'+shareUrl,url:shareUrl};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(shareUrl);notice(t.copied)}}catch(e){}closeModal('#share-modal')};
</script>
</body>
</html>
