/* RIAKHIN TASK4 UX CONVERGENCE NONPROD — source-locked CSS-only additive delta.

/* V1 — shared visible keyboard-focus fallback. Stronger module rules may override locally. */
:where(.header-controls) :is(button,select):focus-visible,
:where(#editor) :is(button,input:not([type="file"]),select,textarea,summary):focus-visible,
:where(.public-submit-panel) :is(button,input,select,textarea,summary):focus-visible{

  outline-offset:2px;
}

/* V2 — shared checkbox normalization, reusing the accepted Social recipe. */
#editor input[type="checkbox"],
.public-submit-panel input[type="checkbox"]{
  appearance:none;
  -webkit-appearance:none;
  display:grid;
  place-content:center;
  flex:0 0 18px;
  width:18px;
  height:18px;
  margin:0;
  border:1.5px solid var(--mobile-border);
  border-radius:5px;
  background:var(--mobile-surface);
  color:#fff;
}
#editor input[type="checkbox"]::before,
.public-submit-panel input[type="checkbox"]::before{
  content:"";
  width:8px;
  height:4px;
  border-left:2px solid currentColor;
  border-bottom:2px solid currentColor;
  transform:rotate(-45deg) scale(0);
  transform-origin:center;
}
#editor input[type="checkbox"]:checked,
.public-submit-panel input[type="checkbox"]:checked{
  border-color:var(--mobile-accent);
  background:var(--mobile-accent);
}
#editor input[type="checkbox"]:checked::before,
.public-submit-panel input[type="checkbox"]:checked::before{
  transform:rotate(-45deg) scale(1);
}
#editor input[type="checkbox"]:focus-visible,
.public-submit-panel input[type="checkbox"]:focus-visible{
  outline:2px solid var(--mobile-focus);
  outline-offset:2px;
}

.public-submit-panel input[type="checkbox"]:disabled{
  opacity:.45;

    de:{trigger:'Anfrage senden',title:'Anfrage senden',badge:'Pilotmodus · TEST',note:'Preview prüfen und genau einen schriftlichen Bestellkontakt auswählen. Ein privater Kontakt wird nicht auf die öffentliche Karte übernommen.',name:'Kontaktname',orderContact:'Bestellkontakt',chooseContact:'Kontakt wählen',privateEmail:'Andere private E-Mail',privateMessenger:'Anderer privater Messenger',privateValue:'Privater Kontakt',privatePlatform:'Messenger',privacy:'Dieser Kontakt wird nur für die Bestellung verwendet und nicht zur öffentlichen Karte hinzugefügt.',confirm:'Ich habe die Preview geprüft und bestätige, dass die öffentlichen Kartendaten mit dieser Anfrage gesendet werden dürfen.',send:'Anfrage senden',close:'Schließen',idle:'Bereit. Die Kartendaten stammen aus dem aktuell gespeicherten Entwurf.',needName:'Bitte Kontaktname angeben.',needChannel:'Bitte genau einen schriftlichen Bestellkontakt auswählen.',needPrivate:'Bitte privaten Kontakt angeben.',needConfirm:'Bitte bestätigen, dass Preview und öffentliche Daten geprüft wurden.',invalidEmail:'Bitte E-Mail-Adresse prüfen.',accepted:'Anfrage angenommen.',rejected:'Senden abgelehnt. Daten können korrigiert und erneut gesendet werden.',unknown:'Sendestatus nicht bestätigt. Nicht erneut senden; request_key zur Prüfung an den Inhaber weitergeben.',locked:'Diese Anfrage wurde bereits gesendet oder hat ein unbestätigtes Ergebnis. Erneutes Senden ist gesperrt.',schema:'Entwurf nicht bereit: native schema 1.1 erforderlich.',draft:'Gespeicherter Entwurf nicht gefunden.',dev:'Öffentlicher Pilot · TEST'},
    pl:{trigger:'Wyślij zgłoszenie',title:'Wyślij zgłoszenie',badge:'Tryb pilotażowy · TEST',note:'Sprawdź Preview i wybierz dokładnie jeden pisemny kontakt do zamówienia. Prywatny kontakt nie trafi na publiczną wizytówkę.',name:'Imię kontaktowe',orderContact:'Kontakt do zamówienia',chooseContact:'Wybierz kontakt',privateEmail:'Inny prywatny Email',privateMessenger:'Inny prywatny komunikator',privateValue:'Prywatny kontakt',privatePlatform:'Komunikator',privacy:'Ten kontakt służy wyłącznie do obsługi zamówienia i nie jest dodawany do publicznej wizytówki.',confirm:'Sprawdziłem(-am) Preview i potwierdzam, że publiczne dane wizytówki mogą zostać wysłane ze zgłoszeniem.',send:'Wyślij zgłoszenie',close:'Zamknij',idle:'Gotowe. Dane wizytówki pochodzą z aktualnie zapisanego szkicu.',needName:'Podaj imię kontaktowe.',needChannel:'Wybierz dokładnie jeden pisemny kontakt do zamówienia.',needPrivate:'Podaj prywatny kontakt.',needConfirm:'Potwierdź sprawdzenie Preview i danych publicznych.',invalidEmail:'Sprawdź adres Email.',accepted:'Zgłoszenie przyjęte.',rejected:'Wysłanie odrzucone. Możesz poprawić dane i wysłać ponownie.',unknown:'Status wysłania nie jest potwierdzony. Nie wysyłaj ponownie; przekaż request_key właścicielowi do weryfikacji.',locked:'To zgłoszenie zostało już wysłane lub ma niepotwierdzony wynik. Ponowne wysłanie jest zablokowane.',schema:'Szkic nie jest gotowy: wymagana native schema 1.1.',draft:'Nie znaleziono zapisanego szkicu.',dev:'Publiczny pilot · TEST'},
    nl:{trigger:'Aanvraag versturen',title:'Aanvraag versturen',badge:'Pilotmodus · TEST',note:'Controleer Preview en kies precies één schriftelijk ordercontact. Een privécontact wordt niet aan de openbare kaart toegevoegd.',name:'Contactnaam',orderContact:'Ordercontact',chooseContact:'Kies een contact',privateEmail:'Ander privé e-mailadres',privateMessenger:'Andere privé messenger',privateValue:'Privécontact',privatePlatform:'Messenger',privacy:'Dit contact wordt alleen voor de bestelling gebruikt en niet aan de openbare kaart toegevoegd.',confirm:'Ik heb Preview gecontroleerd en bevestig dat de openbare kaartgegevens met deze aanvraag mogen worden verzonden.',send:'Aanvraag versturen',close:'Sluiten',idle:'Gereed. Kaartgegevens komen uit het huidige opgeslagen concept.',needName:'Vul een contactnaam in.',needChannel:'Kies precies één schriftelijk ordercontact.',needPrivate:'Vul het privécontact in.',needConfirm:'Bevestig dat Preview en de openbare gegevens zijn gecontroleerd.',invalidEmail:'Controleer het e-mailadres.',accepted:'Aanvraag geaccepteerd.',rejected:'Verzending geweigerd. Je kunt de gegevens aanpassen en opnieuw verzenden.',unknown:'Verzendstatus is niet bevestigd. Verstuur niet opnieuw; geef de request_key aan de eigenaar ter controle.',locked:'Deze aanvraag is al verstuurd of heeft een onbevestigde uitkomst. Opnieuw versturen is geblokkeerd.',schema:'Concept is niet gereed: native schema 1.1 is vereist.',draft:'Opgeslagen concept niet gevonden.',dev:'Publieke pilot · TEST'}
  };
  const uiLocale=()=>copy[document.querySelector('#uiLocale')?.value]?document.querySelector('#uiLocale').value:'en';
  const tr=key=>copy[uiLocale()][key]||copy.en[key]||key;
  const safeId=v=>String(v||'draft').replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)||'draft';
  const stableClone=v=>Array.isArray(v)?v.map(stableClone):(v&&typeof v==='object')?Object.keys(v).sort().reduce((o,k)=>(o[k]=stableClone(v[k]),o),{}):v;
  const canonicalJson=v=>JSON.stringify(stableClone(v));
  const sha256=async str=>{const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')};
  const loadDraft=()=>{
    const raw=localStorage.getItem(DRAFT_KEY);
    if(!raw) throw new Error('NATIVE_DRAFT_UNAVAILABLE');
    let draft;try{draft=JSON.parse(raw)}catch{throw new Error('NATIVE_DRAFT_INVALID_JSON')}
    if(!draft||typeof draft!=='object'||Array.isArray(draft)) throw new Error('NATIVE_DRAFT_OBJECT_REQUIRED');
    if(draft.schema_version!=='1.1') throw new Error(`STATE_SCHEMA_REGRESSION:${String(draft.schema_version)}`);
    return draft;
  };
  const controlKey=draft=>CONTROL_PREFIX+safeId(draft.draft_id);
  const newRequestKey=draft=>`PUBLIC-TEST-${safeId(draft.draft_id)}-${Date.now().toString(36)}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}`;
  const readControl=draft=>{try{const raw=localStorage.getItem(controlKey(draft));return raw?JSON.parse(raw):null}catch{return null}};
  const writeControl=(draft,value)=>{try{localStorage.setItem(controlKey(draft),JSON.stringify(value));return true}catch{return false}};
  const clearControl=draft=>{try{localStorage.removeItem(controlKey(draft));return true}catch{return false}};

  const trigger=document.createElement('button');
  trigger.type='button';trigger.className='public-submit-trigger';trigger.id='publicSubmitTrigger';
  document.querySelector('.header-controls')?.appendChild(trigger);

  const overlay=document.createElement('div');
  overlay.className='public-submit-overlay';overlay.id='publicSubmitOverlay';overlay.setAttribute('aria-hidden','true');
  overlay.innerHTML=`<section class="public-submit-panel" role="dialog" aria-modal="true" aria-labelledby="publicSubmitTitle">
    <div class="public-submit-head"><h2 id="publicSubmitTitle"></h2><button type="button" class="public-submit-close" aria-label="Close">×</button></div>
    <div class="public-submit-badge" id="publicSubmitBadge"></div><p class="public-submit-note" id="publicSubmitNote"></p>
    <div class="public-submit-fields">
      <label><span id="publicSubmitNameLabel"></span><input id="publicSubmitName" autocomplete="name"></label>
      <label><span id="publicSubmitOrderContactLabel"></span><select id="publicSubmitOrderContact"></select><span class="public-submit-contact-note" id="publicSubmitPrivacyNote"></span></label>
      <div class="public-submit-private" id="publicSubmitPrivateWrap">
        <label id="publicSubmitPrivatePlatformWrap"><span id="publicSubmitPrivatePlatformLabel"></span><select id="publicSubmitPrivatePlatform"><option value="telegram">Telegram</option><option value="whatsapp">WhatsApp</option><option value="viber">Viber</option><option value="signal">Signal</option></select></label>
        <label><span id="publicSubmitPrivateValueLabel"></span><input id="publicSubmitPrivateValue" autocomplete="off"></label>
      </div>
      <label class="public-submit-confirm"><input id="publicSubmitConfirm" type="checkbox"><span id="publicSubmitConfirmLabel"></span></label>
      <input id="publicSubmitEmail" type="email" hidden><input id="publicSubmitPhone" type="tel" hidden><input id="publicSubmitMessenger" hidden>
    </div>
    <div class="public-submit-actions"><button type="button" class="public-submit-cancel"></button><button type="button" class="public-submit-send"></button></div>
    <div class="public-submit-receipt" id="publicSubmitReceipt" role="status" aria-live="polite"></div>
  </section>`;
  document.body.appendChild(overlay);
  const $=sel=>overlay.querySelector(sel);
  const receipt=(text,tone='ok')=>{const node=$('#publicSubmitReceipt');node.dataset.tone=tone;node.textContent=String(text)};
  const setLocked=locked=>{$('.public-submit-send').disabled=Boolean(locked)};
  const messengerLabel=item=>item?.platform==='other'?(String(item.custom_platform_name||'').trim()||'Messenger'):({telegram:'Telegram',whatsapp:'WhatsApp',viber:'Viber',signal:'Signal'}[item?.platform]||'Messenger');
  const orderContactOptions=draft=>{
    const emails=(draft?.shared_data?.emails||[]).filter(item=>String(item?.value||'').trim()).map(item=>({key:`email:${item.id}`,kind:'email',value:String(item.value).trim(),label:`Email · ${String(item.label||item.value).trim()}`}));
    const messengers=(draft?.shared_data?.messengers||[]).filter(item=>String(item?.value||'').trim()).map(item=>({key:`messenger:${item.id}`,kind:'messenger',value:String(item.value).trim(),platform:messengerLabel(item),label:`${messengerLabel(item)} · ${String(item.label||item.value).trim()}`}));
    return [...emails,...messengers];
  };
  const refreshOrderContacts=draft=>{
    const select=$('#publicSubmitOrderContact'),previous=select.value,options=orderContactOptions(draft);
    select.innerHTML=`<option value="">${tr('chooseContact')}</option>`+options.map(item=>`<option value="${item.key}">${item.label}</option>`).join('')+`<option value="private:email">${tr('privateEmail')}</option><option value="private:messenger">${tr('privateMessenger')}</option>`;
    if([...select.options].some(option=>option.value===previous))select.value=previous;
    syncPrivateContactUi();
  };
  const syncPrivateContactUi=()=>{const value=$('#publicSubmitOrderContact').value,wrap=$('#publicSubmitPrivateWrap'),platformWrap=$('#publicSubmitPrivatePlatformWrap'),input=$('#publicSubmitPrivateValue');const isPrivate=value.startsWith('private:');wrap.classList.toggle('open',isPrivate);platformWrap.style.display=value==='private:messenger'?'grid':'none';input.type=value==='private:email'?'email':'text';input.autocomplete=value==='private:email'?'email':'off'};
  const selectedOrderContact=draft=>{
    const selected=$('#publicSubmitOrderContact').value;
    if(!selected)return null;
    if(selected==='private:email'){const value=$('#publicSubmitPrivateValue').value.trim();return value?{kind:'email',value,source:'private'}:null}
    if(selected==='private:messenger'){const value=$('#publicSubmitPrivateValue').value.trim(),platform=$('#publicSubmitPrivatePlatform').value;return value?{kind:'messenger',value,platform:({telegram:'Telegram',whatsapp:'WhatsApp',viber:'Viber',signal:'Signal'}[platform]||'Messenger'),source:'private'}:null}
    return orderContactOptions(draft).find(item=>item.key===selected)||null;
  };
  const currentContact=draft=>{const selected=selectedOrderContact(draft),base={name:$('#publicSubmitName').value.trim(),email:'',phone:'',messenger:''};if(selected?.kind==='email')base.email=selected.value;if(selected?.kind==='messenger')base.messenger=`${selected.platform||'Messenger'}: ${selected.value}`;return base};
  const formatReceipt=({status,http='-',requestKey='-',serverId='',reused='-',hash='-',detail=''})=>[
    `STATUS=${status}`,`TEST=true`,`HTTP=${http}`,`request_key=${requestKey}`,serverId?`server_request_id=${serverId}`:'',`reused=${reused}`,`card_state_sha256=${hash}`,detail?`detail=${detail}`:''
  ].filter(Boolean).join('\n');

  const restoreGuard=()=>{
    try{
      const draft=loadDraft(),guard=readControl(draft);
      if(guard&&['sending','unknown','accepted'].includes(guard.state)){
        setLocked(true);
        const state=guard.state==='accepted'?'ACCEPTED':guard.state==='sending'?'UNKNOWN_OUTCOME_NO_RETRY':'UNKNOWN_OUTCOME_NO_RETRY';
        const lead=guard.state==='accepted'?tr('accepted'):tr('locked');
        receipt(`${lead}\n${formatReceipt({status:state,http:guard.http||'-',requestKey:guard.request_key||'-',serverId:guard.server_request_id||'',reused:guard.reused??'-',hash:guard.card_state_sha256||'-'})}`,guard.state==='accepted'?'ok':'warn');
        return;
      }
      setLocked(false);receipt(tr('idle'));
    }catch(err){setLocked(true);receipt(err.message?.startsWith('STATE_SCHEMA_REGRESSION')?tr('schema'):tr('draft'),'error')}
  };
  const syncUi=()=>{
    trigger.textContent=tr('trigger');$('#publicSubmitTitle').textContent=tr('title');$('#publicSubmitBadge').textContent=tr('badge');$('#publicSubmitNote').textContent=tr('note');
    $('#publicSubmitNameLabel').textContent=tr('name');$('#publicSubmitOrderContactLabel').textContent=tr('orderContact');$('#publicSubmitPrivacyNote').textContent=tr('privacy');$('#publicSubmitPrivateValueLabel').textContent=tr('privateValue');$('#publicSubmitPrivatePlatformLabel').textContent=tr('privatePlatform');$('#publicSubmitConfirmLabel').textContent=tr('confirm');
    $('.public-submit-send').textContent=tr('send');$('.public-submit-cancel').textContent=tr('close');$('.public-submit-close').setAttribute('aria-label',tr('close'));
    try{refreshOrderContacts(loadDraft())}catch{}
    const dev=document.querySelector('#devCopy');if(dev)dev.textContent=tr('dev');restoreGuard();
  };
  const open=()=>{overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');try{const currentDraft=loadDraft(),cardLocale=currentDraft.active_card_locale||currentDraft.card_locales?.[0],basicName=String(currentDraft.localized_content?.[cardLocale]?.name||'').trim();if(!$('#publicSubmitName').value.trim())$('#publicSubmitName').value=basicName}catch{}syncUi();$('#publicSubmitName').focus()};
  const close=()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');trigger.focus()};

  const submit=async()=>{
    if(inFlight)return;
    let draft;
    try{draft=loadDraft()}catch(err){receipt(err.message?.startsWith('STATE_SCHEMA_REGRESSION')?tr('schema'):tr('draft'),'error');setLocked(true);return}
    const existing=readControl(draft);
    if(existing&&['sending','unknown','accepted'].includes(existing.state)){restoreGuard();return}
    const selected=selectedOrderContact(draft),contact=currentContact(draft);
    if(!contact.name){receipt(tr('needName'),'error');return}
    if(!selected){receipt($('#publicSubmitOrderContact').value.startsWith('private:')?tr('needPrivate'):tr('needChannel'),'error');return}
    if(selected.kind==='email'&&selected.source==='private'&&!$('#publicSubmitPrivateValue').checkValidity()){receipt(tr('invalidEmail'),'error');return}
    if(!$('#publicSubmitConfirm').checked){receipt(tr('needConfirm'),'error');return}
    const requestKey=newRequestKey(draft),canonical=canonicalJson(draft),hash=await sha256(canonical);
    const payload={request_key:requestKey,schema_version:ENVELOPE_SCHEMA_VERSION,card_state:draft,customer_contact:contact,is_test:true};
    const intent={state:'sending',request_key:requestKey,card_state_sha256:hash,created_at:new Date().toISOString()};
    if(!writeControl(draft,intent)){receipt(formatReceipt({status:'STOP_GUARD_STORAGE_UNAVAILABLE',requestKey,hash,detail:'No network request sent'}),'error');return}
    inFlight=true;setLocked(true);receipt(formatReceipt({status:'SENDING',requestKey,hash}),'warn');
    let response;
    try{
      response=await fetch(SUBMIT_TARGET,{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify(payload)});
    }catch(err){
      writeControl(draft,{...intent,state:'unknown',detail:'network_or_cors'});
      receipt(`${tr('unknown')}\n${formatReceipt({status:'UNKNOWN_OUTCOME_NO_RETRY',requestKey,hash,detail:'network_or_cors'})}`,'warn');
      inFlight=false;return;
    }
    let body=null,parsed=true;
    try{body=await response.json()}catch{parsed=false}
    if(response.ok&&parsed&&body?.ok===true){
      const serverId=String(body.request_id||body.receipt_id||body.id||'').trim();
      const accepted={...intent,state:'accepted',http:response.status,server_request_id:serverId,reused:Boolean(body.reused),accepted_at:new Date().toISOString()};
      writeControl(draft,accepted);
      receipt(`${tr('accepted')}\n${formatReceipt({status:'ACCEPTED',http:response.status,requestKey,serverId,reused:Boolean(body.reused),hash})}`,'ok');
      inFlight=false;return;
    }
    if(!response.ok){
      const serverCode=parsed&&typeof body?.error==='string'?body.error:'unrecognized_http_error';
      if(knownDeterministicRejection(response,parsed,body)){
        clearControl(draft);setLocked(false);
        receipt(`${tr('rejected')}\n${formatReceipt({status:'REJECTED',http:response.status,requestKey,hash,detail:serverCode})}`,'error');
        inFlight=false;return;
      }
      writeControl(draft,{...intent,state:'unknown',http:response.status,detail:serverCode});
      receipt(`${tr('unknown')}\n${formatReceipt({status:'UNKNOWN_OUTCOME_NO_RETRY',http:response.status,requestKey,hash,detail:serverCode})}`,'warn');
      inFlight=false;return;
    }
    writeControl(draft,{...intent,state:'unknown',http:response.status,detail:'unexpected_success_response'});
    receipt(`${tr('unknown')}\n${formatReceipt({status:'UNKNOWN_OUTCOME_NO_RETRY',http:response.status,requestKey,hash,detail:'unexpected_success_response'})}`,'warn');
    inFlight=false;
  };

  trigger.onclick=open;$('.public-submit-cancel').onclick=close;$('.public-submit-close').onclick=close;$('.public-submit-send').onclick=()=>submit().catch(err=>{receipt(`STOP_CLIENT_ERROR\n${String(err?.message||err)}`,'error');setLocked(true);inFlight=false});
  $('#publicSubmitOrderContact').addEventListener('change',syncPrivateContactUi);
  overlay.addEventListener('click',event=>{if(event.target===overlay)close()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&overlay.classList.contains('open'))close()});document.querySelector('#uiLocale')?.addEventListener('change',syncUi);
  syncUi();
})();
</script>
